name: Frontend CI

on:
  pull_request:
    branches:
      - dev

jobs:
  ci-frontend:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESlint
        working-directory: frontend
        run: npm run lint

      # TODO: Here we should add tests for the frontend once they 
      # are implemented, for now we skip this step but here is how it 
      # would look like:
      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build