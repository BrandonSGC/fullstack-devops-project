name: Frontend CD

on:
  push:
    branches:
      - cd/frontend

env:
    RESOURCE_GROUP: rg-fullstack-devops-dev

jobs:
  deploy-frontend-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "frontend"
          output_location: "dist"
          # The following line stops the action from trying to 
          # build the app again (We already built it in a previous 
          # step), without this line the deployment would fail due
          # that this action uses a different node version than the 
          # one we used to build the frontend.
          skip_app_build: true 
