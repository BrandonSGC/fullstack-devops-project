name: Backend CD (Dev)

on:
  push:
    branches:
      - cd/backend

env:
  RESOURCE_GROUP: rg-fullstack-devops-dev
  ACR_LOGIN_SERVER: acrprjctbgcdev.azurecr.io
  APP_SERVICE_NAME: fullstack-appservice-dev


jobs:
  deploy-backend-dev:
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Azure using the Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name acrprjctbgcdev

      # Build Docker image
      - name: Build Docker image
        working-directory: backend
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/backend:${IMAGE_TAG} \
            .

      # Push Docker image to ACR
      - name: Push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend:${IMAGE_TAG}

      # Deploy image to App Service
      - name: Deploy to App Service
        run: |
          IMAGE_TAG=${{ github.sha }}
          az webapp config container set \
            --name $APP_SERVICE_NAME \
            --resource-group $RESOURCE_GROUP \
            --container-image-name $ACR_LOGIN_SERVER/backend:$IMAGE_TAG \
            --container-registry-url https://$ACR_LOGIN_SERVER

